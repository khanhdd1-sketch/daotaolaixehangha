<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Thi thu ly thuyet noi bo - chon de va lam bai.">
  <title>Trung tam day lai xe | Thi ly thuyet</title>
  <link href="./assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="./assets/vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <link href="/src/css/main.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
  <main class="page-shell student-page-shell">
    <div class="container">
      <section class="student-shell mb-4">
        <div class="student-shell-topbar">
          <a class="navbar-brand text-decoration-none" href="/exam.html">← Dashboard</a>
          <div class="student-top-actions">
            <a class="btn btn-outline-secondary" href="/exam.html">Về dashboard</a>
            <button class="btn btn-primary" type="button" id="studentLogoutButton">Đăng xuất</button>
          </div>
        </div>
        <div class="student-hero mt-4">
          <div>
            <span class="section-badge mb-3">Thi lý thuyết</span>
            <h1 class="h3 mb-1">Xin chào, <span id="welcomeStudent"></span></h1>
            <p class="text-muted mb-0">Chọn đề, làm bài có đếm thời gian và xem giải thích sau khi nộp.</p>
          </div>
          <span class="compact-badge" id="theoryExamBadge">0 đề</span>
        </div>
      </section>

      <div id="theoryLoadingShell" class="dashboard-card mb-4 p-4 text-center">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-3 mb-0">Đang tải danh sách đề...</p>
      </div>

      <div id="theoryContentShell" class="d-none">
        <section class="dashboard-card mb-4">
          <div class="row g-3" id="theoryExamGrid"></div>
        </section>

        <section class="dashboard-card mb-4 d-none" id="theoryRunnerSection">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <div>
              <h2 class="h4 mb-1" id="theoryRunnerTitle">Làm đề thi</h2>
              <p class="text-muted mb-0" id="theoryRunnerMeta"></p>
            </div>
            <span class="timer-pill" id="theoryTimerBadge">--:--</span>
          </div>
          <form id="theoryExamForm">
            <div id="theoryQuestionList" class="exam-question-list"></div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <button class="btn btn-outline-secondary" id="cancelTheoryButton" type="button">Đóng đề</button>
              <button class="btn btn-primary" type="submit">Nộp bài lý thuyết</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>
  <script defer src="./assets/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script defer src="/src/js/constants/legacyGlobals.js"></script>
  <script defer src="/src/js/common.js"></script>
  <script defer src="/src/js/i18n.js"></script>
  <script type="module" src="/src/js/entries/theory-exam.js"></script>
</body>
</html>
