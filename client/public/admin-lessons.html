<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Admin — Bài học">
  <title>Trung tâm dạy lái xe | Admin — Bài học</title>
  <link href="./assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="./assets/vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <link href="/src/css/main.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
  <main class="page-shell">
    <div class="container">
      <div id="adminShellHero"></div>
      <div id="adminShellNav"></div>
      <div id="section-lessons">
      <section class="row g-4 mb-4">
        <div class="col-xl-5">
          <div class="dashboard-card h-100">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h2 class="h4 mb-1">Quản lý bài học</h2>
                <p class="text-muted mb-0">Tạo bài học video, thứ tự và điểm đạt quiz.</p>
              </div>
              <span class="compact-badge" id="lessonCountBadge">0 bài</span>
            </div>
            <form id="lessonForm" class="row g-3 mb-4">
              <input id="lessonId" name="id" type="hidden">
              <div class="col-md-4">
                <label class="form-label" for="lessonCourseType">Loại bằng</label>
                <select class="form-select" id="lessonCourseType" name="course_type" required>
                  <option value="A1">A1</option>
                  <option value="A2">A2</option>
                  <option value="B1">B1</option>
                  <option value="B2" selected>B2</option>
                  <option value="C1">C1</option>
                </select>
              </div>
              <div class="col-md-8">
                <label class="form-label" for="lessonTitle">Tên bài học</label>
                <input class="form-control" id="lessonTitle" name="title" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="lessonDescription">Mô tả</label>
                <textarea class="form-control" id="lessonDescription" name="description" rows="2"></textarea>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="lessonOrderNo">Thứ tự</label>
                <input class="form-control" id="lessonOrderNo" name="order_no" type="number" min="1" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="lessonPassScore">Điểm đạt quiz</label>
                <input class="form-control" id="lessonPassScore" name="pass_score" type="number" min="1" required>
              </div>
              <div class="col-md-4 d-flex align-items-end">
                <div class="form-check">
                  <input class="form-check-input" id="lessonActive" name="active" type="checkbox" checked>
                  <label class="form-check-label" for="lessonActive">Đang kích hoạt</label>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label" for="lessonVideoUrl">URL video bài học</label>
                <input class="form-control" id="lessonVideoUrl" name="video_url" required>
              </div>
              <div class="col-12 d-flex gap-2 justify-content-end">
                <button class="btn btn-outline-secondary" id="resetLessonFormButton" type="button">Làm mới</button>
                <button class="btn btn-primary" type="submit">Lưu bài học</button>
              </div>
            </form>
            <div class="table-filter-grid mb-3">
              <div>
                <label class="form-label" for="lessonSearchInput">Tìm bài học</label>
                <input class="form-control" id="lessonSearchInput" type="search" placeholder="Tên, mô tả">
              </div>
              <div>
                <label class="form-label" for="lessonListCourseFilter">Lọc loại bằng</label>
                <select class="form-select" id="lessonListCourseFilter">
                  <option value="">Tất cả</option>
                  <option value="A1">A1</option>
                  <option value="A2">A2</option>
                  <option value="B1">B1</option>
                  <option value="B2">B2</option>
                  <option value="C1">C1</option>
                </select>
              </div>
            </div>
            <div class="admin-list-shell" id="lessonList"></div>
          </div>
        </div>

        <div class="col-xl-7">
          <div class="dashboard-card h-100">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
              <div>
                <h2 class="h4 mb-1">Câu hỏi quiz bài học</h2>
                <p class="text-muted mb-0">Câu hỏi sau khi học viên xem video bài học.</p>
              </div>
              <span class="compact-badge" id="lessonQuestionCountBadge">0 câu</span>
            </div>
            <form id="lessonQuestionForm" class="row g-3 mb-4">
              <input id="lessonQuestionId" name="id" type="hidden">
              <div class="col-md-6">
                <label class="form-label" for="lessonQuestionLessonId">Bài học</label>
                <select class="form-select" id="lessonQuestionLessonId" name="lesson_id" required></select>
              </div>
              <div class="col-md-3">
                <label class="form-label" for="lessonQuestionCorrectAnswer">Đáp án đúng</label>
                <select class="form-select" id="lessonQuestionCorrectAnswer" name="correct_answer" required>
                  <option value="A">A</option>
                  <option value="B">B</option>
                  <option value="C">C</option>
                  <option value="D">D</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label" for="lessonQuestionText">Nội dung câu hỏi</label>
                <textarea class="form-control" id="lessonQuestionText" name="question" rows="2" required></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="lessonOptionA">Đáp án A</label>
                <input class="form-control" id="lessonOptionA" name="option_a" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="lessonOptionB">Đáp án B</label>
                <input class="form-control" id="lessonOptionB" name="option_b" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="lessonOptionC">Đáp án C</label>
                <input class="form-control" id="lessonOptionC" name="option_c" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="lessonOptionD">Đáp án D</label>
                <input class="form-control" id="lessonOptionD" name="option_d" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="lessonQuestionExplanation">Giải thích</label>
                <textarea class="form-control" id="lessonQuestionExplanation" name="explanation" rows="2"></textarea>
              </div>
              <div class="col-12 d-flex gap-2 justify-content-end">
                <button class="btn btn-outline-secondary" id="resetLessonQuestionFormButton" type="button">Làm mới</button>
                <button class="btn btn-primary" type="submit">Lưu câu hỏi</button>
              </div>
            </form>
            <div class="table-filter-grid mb-3">
              <div>
                <label class="form-label" for="lessonQuestionSearchInput">Tìm câu hỏi</label>
                <input class="form-control" id="lessonQuestionSearchInput" type="search" placeholder="Nội dung, giải thích">
              </div>
              <div>
                <label class="form-label" for="lessonQuestionLessonFilter">Lọc theo bài</label>
                <select class="form-select" id="lessonQuestionLessonFilter">
                  <option value="">Tất cả bài</option>
                </select>
              </div>
            </div>
            <div class="table-shell">
              <table class="table align-middle admin-table">
                <thead>
                  <tr>
                    <th>Bài học</th>
                    <th>Câu hỏi</th>
                    <th>Đúng</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="lessonQuestionTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
      </div>
    </div>
  </main>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>
  <script defer src="./assets/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script defer src="/src/js/common.js"></script>
  <script defer src="/src/js/i18n.js"></script>
  <script type="module" src="/src/js/entries/admin-lessons.js"></script>
  <!-- ✅ Modal preview ảnh -->
  <div class="modal fade" id="proofPreviewModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">

        <!-- Header -->
        <div class="modal-header">
          <h5 class="modal-title" id="proofPreviewMeta">
            Xem ảnh minh chứng
          </h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <!-- Body -->
        <div class="modal-body text-center">

          <!-- Ảnh -->
          <img
            id="proofPreviewImage"
            class="img-fluid d-none"
            style="max-height: 500px;"
          />

          <!-- Fallback -->
          <div id="proofPreviewFallback">
            Ảnh minh chứng sẽ hiển thị tại đây.
          </div>

          <!-- URL -->
          <div id="proofPreviewUrlGroup" class="mt-3 d-none">
            <input
              id="proofPreviewUrl"
              class="form-control"
              readonly
            />
          </div>

          <!-- Link mở ngoài -->
          <a
            id="proofPreviewExternalLink"
            target="_blank"
            class="btn btn-outline-primary mt-3 d-none"
          >
            Mở ảnh trong tab mới
          </a>

        </div>

      </div>
    </div>
  </div>
</body>
</html>

</body>
</html>
