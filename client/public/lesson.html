<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Học bài</title>

  <link href="/assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <style>
    .animate-modal {
      animation: zoomIn 0.3s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .selected-option {
      background-color: #e7f1ff;
      border-radius: 6px;
      padding: 4px;
      transition: all 0.25s ease;
    }
    
    .correct {
      animation: correctPulse 0.4s ease;
      border: 2px solid #28a745 !important;
    }

    .wrong {
      animation: wrongShake 0.4s ease;
      border: 2px solid #dc3545 !important;
    }

    @keyframes correctPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    @keyframes wrongShake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>

<body>

<div class="container-fluid">
  <div class="row">

    <!-- MAIN -->
    <div class="col-lg-8 p-4">

      <h4 id="lessonTitle" class="fw-bold mb-3"></h4>

      <!-- VIDEO -->
      <div class="card shadow-sm mb-4">
        <div class="ratio ratio-16x9">
          <iframe id="lessonVideo" allowfullscreen></iframe>
        </div>

        <div class="p-3 text-center">
          <button id="markCompleteBtn" class="btn btn-success px-4">
            ✅ Đã xem xong
          </button>
        </div>
      </div>

      <!-- QUIZ -->
      <div id="quizSection" class="card p-4 d-none shadow-sm">
        <h5 class="mb-3">📘 Trắc nghiệm</h5>
        <form id="quizForm"></form>

        <button class="btn btn-primary w-100 mt-3" id="submitQuizBtn">
          Nộp bài
        </button>
      </div>

    </div>

    <!-- SIDEBAR -->
    <div class="col-lg-4 p-4 bg-light border-start sticky-top" style="height:100vh">

      <h6 class="fw-bold">📊 Tiến độ</h6>

      <div class="progress mb-2">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <small id="progressText"></small>

      <hr>

      <div id="lessonList"></div>

    </div>

  </div>
</div>


<!-- RESULT MODAL -->
<div class="modal fade" id="resultModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Kết quả bài học</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body text-center">
        <h4 id="resultStatus"></h4>
        <p id="resultScore" class="mb-3"></p>

        <div id="resultDetails" class="text-start small"></div>
      </div>


      <div class="modal-footer">
        <button id="retryBtn" class="btn btn-outline-secondary">
          Làm lại
        </button>

        <button id="nextLessonBtn" class="btn btn-success d-none">
          Bài tiếp →
        </button>

        <button id="backBtn" class="btn btn-primary">
          Về dashboard
        </button>
      </div>
    </div>
  </div>
</div>

<!-- IMAGE PREVIEW MODAL -->
<div class="modal fade" id="imagePreviewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content bg-dark border-0">
      <div class="modal-body text-center p-2">
        <img id="previewImage" class="img-fluid rounded" alt="Xem ảnh"/>
      </div>
    </div>
  </div>
</div>

<script src="../src/js/common.js"></script>
<script type="module" src="../src/js/entries/student-lesson.js"></script>
<script src="/assets/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
