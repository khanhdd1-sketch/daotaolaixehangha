<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Admin — Mô phỏng">
  <title>Trung tâm dạy lái xe | Admin — Mô phỏng</title>
  <link href="./assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="./assets/vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <link href="/src/css/main.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
  <main class="page-shell">
    <div class="container">
      <div id="adminShellHero"></div>
      <div id="adminShellNav"></div>
      <div id="section-simulation">
      <section class="row g-4 mb-4">
        <div class="col-xl-5">
          <div class="dashboard-card h-100">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h2 class="h4 mb-1">Đề thi mô phỏng</h2>
                <p class="text-muted mb-0">Tạo bài thi mô phỏng cho từng loại bằng.</p>
              </div>
              <span class="compact-badge" id="simulationExamCountBadge">0 đề</span>
            </div>
            <form id="simulationExamForm" class="row g-3 mb-4">
              <input id="simulationExamId" name="id" type="hidden">
              <div class="col-md-4">
                <label class="form-label" for="simulationExamCourseType">Loại bằng</label>
                <select class="form-select" id="simulationExamCourseType" name="course_type" required>
                  <option value="A1">A1</option>
                  <option value="A2">A2</option>
                  <option value="B1">B1</option>
                  <option value="B2" selected>B2</option>
                  <option value="C1">C1</option>
                </select>
              </div>
              <div class="col-md-8">
                <label class="form-label" for="simulationExamTitle">Tên bài mô phỏng</label>
                <input class="form-control" id="simulationExamTitle" name="title" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="simulationExamDescription">Mô tả</label>
                <textarea class="form-control" id="simulationExamDescription" name="description" rows="2"></textarea>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="simulationExamPassScore">Điểm đạt</label>
                <input class="form-control" id="simulationExamPassScore" name="pass_score" type="number" min="1" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="simulationExamTotalClips">Tổng clip</label>
                <input class="form-control" id="simulationExamTotalClips" name="total_clips" type="number" min="1" required>
              </div>
              <div class="col-md-4 d-flex align-items-end">
                <div class="form-check">
                  <input class="form-check-input" id="simulationExamActive" name="active" type="checkbox" checked>
                  <label class="form-check-label" for="simulationExamActive">Đang kích hoạt</label>
                </div>
              </div>
              <div class="col-12 d-flex gap-2 justify-content-end">
                <button class="btn btn-outline-secondary" id="resetSimulationExamFormButton" type="button">Làm mới</button>
                <button class="btn btn-primary" type="submit">Lưu bài mô phỏng</button>
              </div>
            </form>
            <div class="admin-list-shell" id="simulationExamList"></div>
          </div>
        </div>

        <div class="col-xl-7">
          <div class="dashboard-card h-100">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
              <div>
                <h2 class="h4 mb-1">Clip mô phỏng</h2>
                <p class="text-muted mb-0">Gắn video, thứ tự và cửa sổ tính điểm cho mỗi clip.</p>
              </div>
              <span class="compact-badge" id="simulationClipCountBadge">0 clip</span>
            </div>
            <form id="simulationClipForm" class="row g-3 mb-4">
              <input id="simulationClipId" name="id" type="hidden">
              <div class="col-md-5">
                <label class="form-label" for="simulationClipExamId">Bài mô phỏng</label>
                <select class="form-select" id="simulationClipExamId" name="exam_id" required></select>
              </div>
              <div class="col-md-7">
                <label class="form-label" for="simulationClipTitle">Tên clip</label>
                <input class="form-control" id="simulationClipTitle" name="title" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="simulationClipVideoUrl">URL video</label>
                <input class="form-control" id="simulationClipVideoUrl" name="video_url" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="simulationClipOrderNo">Thứ tự</label>
                <input class="form-control" id="simulationClipOrderNo" name="order_no" type="number" min="1" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="simulationClipTriggerStart">Bắt đầu tính điểm</label>
                <input class="form-control" id="simulationClipTriggerStart" name="trigger_start_sec" type="number" step="0.1" min="0" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="simulationClipTriggerEnd">Kết thúc tính điểm</label>
                <input class="form-control" id="simulationClipTriggerEnd" name="trigger_end_sec" type="number" step="0.1" min="0" required>
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" id="simulationClipActive" name="active" type="checkbox" checked>
                  <label class="form-check-label" for="simulationClipActive">Đang kích hoạt</label>
                </div>
              </div>
              <div class="col-12 d-flex gap-2 justify-content-end">
                <button class="btn btn-outline-secondary" id="resetSimulationClipFormButton" type="button">Làm mới</button>
                <button class="btn btn-primary" type="submit">Lưu clip</button>
              </div>
            </form>
            <div class="table-filter-grid mb-3">
              <div>
                <label class="form-label" for="simulationClipSearchInput">Tìm clip</label>
                <input class="form-control" id="simulationClipSearchInput" type="search" placeholder="Tên clip, URL video">
              </div>
              <div>
                <label class="form-label" for="simulationClipExamFilter">Lọc theo bài</label>
                <select class="form-select" id="simulationClipExamFilter">
                  <option value="">Tất cả bài</option>
                </select>
              </div>
            </div>
            <div class="table-shell">
              <table class="table align-middle admin-table">
                <thead>
                  <tr>
                    <th>Bài thi</th>
                    <th>Clip</th>
                    <th>Cửa sổ tính điểm</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="simulationClipTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
      </div>
    </div>
  </main>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>
  <script defer src="./assets/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script defer src="/src/js/common.js"></script>
  <script defer src="/src/js/i18n.js"></script>
  <script type="module" src="/src/js/entries/admin-simulation.js"></script>
  <!-- ✅ Modal preview ảnh -->
  <div class="modal fade" id="proofPreviewModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">

        <!-- Header -->
        <div class="modal-header">
          <h5 class="modal-title" id="proofPreviewMeta">
            Xem ảnh minh chứng
          </h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <!-- Body -->
        <div class="modal-body text-center">

          <!-- Ảnh -->
          <img
            id="proofPreviewImage"
            class="img-fluid d-none"
            style="max-height: 500px;"
          />

          <!-- Fallback -->
          <div id="proofPreviewFallback">
            Ảnh minh chứng sẽ hiển thị tại đây.
          </div>

          <!-- URL -->
          <div id="proofPreviewUrlGroup" class="mt-3 d-none">
            <input
              id="proofPreviewUrl"
              class="form-control"
              readonly
            />
          </div>

          <!-- Link mở ngoài -->
          <a
            id="proofPreviewExternalLink"
            target="_blank"
            class="btn btn-outline-primary mt-3 d-none"
          >
            Mở ảnh trong tab mới
          </a>

        </div>

      </div>
    </div>
  </div>
</body>
</html>

</body>
</html>
